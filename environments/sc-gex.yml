# Upstream environment: cells, transcriptional states, UMAP (stages A, C).
# Versions of the environment that ran the original analysis (Sep 2026).
# h5py (read directly by c1d_umap.py) comes in as a dependency of anndata; its version was not recorded.
name: sc-gex
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.12.14
  - numpy=2.5.2
  - scipy=1.18.0
  - pandas=3.0.5
  - scanpy=1.12.4
  - anndata=0.13.3
  - harmonypy=2.0.0
  - leidenalg=0.12.0
  - python-igraph=1.0.0
  - umap-learn=0.5.12
  - scikit-learn=1.9.0
  - h5py

# Sequence cross-check (stages vxt1, vxt2). parasail-python comes from bioconda: its PyPI wheel does not build on macOS.
# tcrdist3 refuses a dense distance matrix above 10,000 clones unless compute_distances() is called explicitly (vxt1 does).
name: tcrdist3
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.10
  - numpy=2.2.6
  - parasail-python=1.3.4
  - pip
  - pip:
      - tcrdist3==0.3
      - pwseqdist==0.6
      - fishersapi==1.0
      - pandas==2.3.3
      - scipy==1.15.3
      - numba==0.67.0
      - matplotlib==3.10.9
